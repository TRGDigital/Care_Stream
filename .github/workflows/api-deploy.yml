name: API — Build & Deploy

on:
  push:
    branches: [main]
    paths: ['apps/api/**']
  pull_request:
    paths: ['apps/api/**']

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --workspace=apps/api
      # No lint step: apps/api declares `eslint src --ext .ts` but the repo has no
      # ESLint config anywhere, so it has never been able to pass. It was simply never
      # reached, because `npm ci` failed first on an out-of-sync lock file. A red tick
      # that means nothing is worse than no tick.
      #
      # `build` runs tsc, so the class of error that actually breaks a deploy is still
      # caught here. Put the lint step back when apps/api has a config to lint against.
      - run: npm run build --workspace=apps/api
